name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile all Python modules
        run: uv run python -m compileall -q .

      - name: Run deterministic unit tests (trace replay & converter)
        run: uv run pytest trace_replay/ -v

      - name: Run retrieval evaluation (30-query benchmark)
        run: uv run python evals/evaluate_retrieval.py

      - name: Verify offline evaluation alignment metrics
        run: uv run python evals/metrics.py evals/results_judged.json
