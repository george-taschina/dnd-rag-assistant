[project]
name = "dnd-rag-assistant"
version = "0.1.0"
description = "RAG assistant for Dungeons & Dragons 5E: answers rules, spell and character questions from the official rulebooks, with citations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitsource>=0.0.5",
    "logfire>=5.2.0",
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "pydantic-ai-slim[openai]>=2.56.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# The agent fixture is module-scoped and holds an HTTP client: tests of the
# same module must share one event loop or that client ends up on a dead loop.
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
